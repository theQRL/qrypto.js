version: 2
updates:
  # npm workspaces share the root lockfile. Directory-specific updates can
  # change a workspace manifest without updating that lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "turbo"
    ignore:
      # conventional-changelog-conventionalcommits@10 dropped its handlebars
      # templates and requires conventional-changelog-writer@9. semantic-release
      # 25 still pins writer ^8 (via commit-analyzer/release-notes-generator),
      # so the v10 preset fails generateNotes. Unpin once semantic-release ships
      # a release-notes-generator built on writer 9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: [">=10"]
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
